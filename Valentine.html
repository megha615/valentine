<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Surprise!</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
    background-color: #fff0f5;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  .card {
    background-color: white;
    padding: 60px 40px;
    border-radius: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    max-width: 500px;
    opacity: 0;
    animation: fadeIn 1.5s forwards;
  }

  h2 {
    font-family: 'Pacifico', cursive;
    font-size: 36px;
    color: #ff4d6d;
    margin-bottom: 20px;
  }

  img {
    width: 100%;
    max-width: 400px;
    border-radius: 15px;
    margin-top: 20px;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="card">
    <h2>Surprise! 💖</h2>
    <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExdnBmYnNqcWU5ejUycTR2a251NWxicThoOXp6MnJjdXg0dHJ6dW43YSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/igB2Th9e4nW6s/giphy.gif" alt="Shocking Barbie GIF">
  </div>
</body>
</html>
