<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine Intro</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;

    /* Sticker background */
    background-image: url('gitstick.png'); /* your sticker */
    background-repeat: repeat;
    background-size: 80px 80px;
    height: 100vh;
    width: 80vw;
    position: relative;
  }

  /* Center card using absolute positioning */
  .card {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%); /* perfect center */
    background-color: white;
    padding: 50px 40px;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    text-align: center;
    width: 90%;
    max-width: 400px;
    z-index: 10;
  }

  h2 {
    margin: 0 0 10px 0;
    font-size: 24px;
  }

  p {
    margin: 0 0 20px 0;
    font-size: 18px;
  }

  /* Heart inside card */
  #heart {
    font-size: 100px; /* big heart */
    color: red;
    text-decoration: none;
    cursor: pointer;
    display: block;
    margin: 0 auto;
    transition: transform 0.3s ease;
  }

  #heart:hover {
    transform: scale(1.3);
  }
</style>
</head>
<body>
  <div class="card">
    <h2>Hey cutie, you have a question 😘</h2>
    <p>Click the heart to see the question</p>
    <a href="valentine.html" id="heart">❤️</a>
  </div>
</body>
</html>
