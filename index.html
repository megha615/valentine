<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine Surprise</title>

<!-- Cute handwriting font -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
    background-color: #fff0f5;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .card {
    background-color: white;
    padding: 60px 40px;
    border-radius: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
    max-width: 500px;
    opacity: 0;
    animation: fadeIn 1.5s forwards;
  }

  h2 {
    font-family: 'Pacifico', cursive;
    font-size: 36px;
    color: #ff4d6d;
    margin-bottom: 30px;
  }

  p {
    font-size: 18px;
    margin: 0 0 30px 0;
  }

  #heart {
    font-size: 100px;
    color: red;
    text-decoration: none;
    display: block;
    margin: 0 auto;
    cursor: pointer;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="card">
    <h2>Hey Darshan 💖<br>Will you be my Valentine?</h2>
    <p>Click the heart to see the surprise 💌</p>
    <a href="valentine.html" id="heart">❤️</a>
  </div>
</body>
</html>
