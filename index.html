  <title>Valentine Intro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      /* Sticker background */
      background-image: url('gitstick.png'); /* your uploaded sticker */
      background-repeat: repeat;
      background-size: 80px 80px;
    }

    /* Center card */
    .card {
      background-color: white; /* clean box */
      padding: 50px 40px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
      z-index: 2;
    }

    #heart {
      font-size: 70px;
      color: red;
      cursor: pointer;
      transition: transform 0.3s ease;
      display: inline-block;
      margin-top: 20px;
    }

    #heart:hover {
      transform: scale(1.3);
    }

    a {
      text-decoration: none;
      color: inherit;
    }
  </style>
</head>
