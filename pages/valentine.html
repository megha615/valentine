<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Will you be my Valentine?</title>

<!-- Google Font: Cute handwriting -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
  /* Full page */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
    background-color: #fff0f5; /* soft pink background */
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Center card */
  .card {
    background-color: white;
    padding: 60px 40px;
    border-radius: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
    max-width: 500px;
  }

  /* Cute Valentine text */
  h2 {
    font-family: 'Pacifico', cursive;
    font-size: 36px;
    color: #ff4d6d;
    margin-bottom: 30px;
  }

  /* Optional paragraph */
  p {
    font-size: 18px;
    margin: 0 0 30px 0;
  }

  /* Heart button */
  #heart {
    font-size: 100px;
    color: red;
    text-decoration: none;
    display: block;
    margin: 0 auto;
    cursor: pointer;
    transition: transform 0.3s ease;
  }

  #heart:hover {
    transform: scale(1.3);
  }
</style>
</head>
<body>
  <div class="card">
    <h2>Hey Darshan 💖<br>Will you be my Valentine?</h2>
    <p>Click the heart to see the surprise 💌</p>
    <!-- Heart button -->
    <a href="pages/valentine.html" id="heart">❤️</a>
  </div>
</body>
</html>
